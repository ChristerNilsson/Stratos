name: Deploy site and FastHTML app to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kribban.se
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR || '/var/www/kribban.se' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1 || { echo "ERROR: Decoded key is invalid. Check SSH_PRIVATE_KEY_B64."; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Sync changed files to VPS
        run: |
          echo "Connecting to $SSH_USERNAME@$SSH_HOST:$SSH_PORT"
          echo "Target directory: $SSH_REMOTE_DIR"
          rsync \
            --archive \
            --checksum \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.py[cod]' \
            --exclude='*.db*' \
            --exclude='.sesskey' \
            --exclude='.requirements.sha256' \
            --exclude='anteckningar*' \
            --exclude='README*' \
            --exclude='spec*' \
            --exclude='*.pdf' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey -p $SSH_PORT" \
            ./ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR/"

      - name: Install and restart FastHTML app
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=publickey \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "REMOTE_DIR='$SSH_REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REMOTE_DIR"

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi

          requirements_hash="$(sha256sum requirements.txt | awk '{print $1}')"
          installed_hash="$(cat .requirements.sha256 2>/dev/null || true)"
          if [ "$requirements_hash" != "$installed_hash" ]; then
            .venv/bin/python -m pip install -r requirements.txt
            printf '%s\n' "$requirements_hash" > .requirements.sha256
          fi

          if [ ! -s .sesskey ]; then
            umask 027
            python3 -c 'import secrets; print(secrets.token_hex(32))' > .sesskey
          fi
          sudo chgrp www-data .sesskey
          chmod 640 .sesskey

          if ! sudo cmp -s kribban.service /etc/systemd/system/kribban.service; then
            sudo install -m 0644 kribban.service /etc/systemd/system/kribban.service
            sudo systemctl daemon-reload
          fi

          sudo systemctl is-enabled --quiet kribban || sudo systemctl enable kribban
          sudo systemctl restart kribban
          sudo systemctl is-active --quiet kribban
          REMOTE
