name: Deploy static site to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kribban.se
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '212.227.48.64' }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME || 'root' }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_REMOTE_DIR: ${{ vars.SSH_REMOTE_DIR || '/var/www/kribban.se' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up SSH known_hosts
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "ERROR: SSH_HOST is not set."
            exit 1
          fi
          if [ -z "$SSH_USERNAME" ]; then
            echo "ERROR: SSH_USERNAME is not set."
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "ERROR: SSH_PRIVATE_KEY_B64 secret is not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1 || { echo "ERROR: Decoded key is invalid. Check SSH_PRIVATE_KEY_B64."; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to VPS (SSH/SCP)
        run: |
          echo "Connecting to $SSH_USERNAME@$SSH_HOST:$SSH_PORT"
          echo "Target directory: $SSH_REMOTE_DIR"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey -P "$SSH_PORT" -r ./ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR"

      - name: Remove local excluded files
        run: |
          echo "Deployment completed."
