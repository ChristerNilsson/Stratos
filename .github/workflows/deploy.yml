name: Deploy static site to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '212.227.48.64' }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME || 'root' }}
      SSH_PASSWORD: ${{ vars.SSH_PASSWORD || '' }}
      SSH_PRIVATE_KEY: ${{ vars.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY || '' }}
      SSH_KEY_PATH: ''
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_REMOTE_DIR: ${{ vars.SSH_REMOTE_DIR || '/var/www/kribban.se' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up SSH known_hosts
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "ERROR: SSH_HOST is not set."
            exit 1
          fi
          if [ -z "$SSH_USERNAME" ]; then
            echo "ERROR: SSH_USERNAME is not set."
            exit 1
          fi
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            echo "SSH_KEY_PATH=$HOME/.ssh/id_rsa" >> "$GITHUB_ENV"
          else
            ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
            echo "SSH_KEY_PATH=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"
          fi
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to VPS (SSH/SCP)
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -P "$SSH_PORT" -r ./ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR"

      - name: Remove local excluded files
        run: |
          echo "Deployment completed."
