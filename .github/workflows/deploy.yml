name: Deploy static site to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME || vars.SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || vars.SSH_PASSWORD }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_REMOTE_DIR: ${{ vars.SSH_REMOTE_DIR || '/var/www/kribban.se' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up SSH known_hosts
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "ERROR: SSH_HOST is not set. Add it as a GitHub Secret or Repository Variable."
            exit 1
          fi
          if [ -z "$SSH_USERNAME" ]; then
            echo "ERROR: SSH_USERNAME is not set. Add it as a GitHub Secret or Repository Variable."
            exit 1
          fi
          if [ -z "$SSH_PASSWORD" ]; then
            echo "ERROR: SSH_PASSWORD is not set. Add it as a GitHub Secret or Repository Variable."
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to VPS (SCP with password)
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USERNAME }}
          password: ${{ env.SSH_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          source: "./"
          target: ${{ env.SSH_REMOTE_DIR }}
          rm: true
          debug: true

      - name: Remove local excluded files
        run: |
          echo "Deployment completed."
