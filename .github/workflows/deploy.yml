name: Deploy static site to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ vars.SSH_HOST || '212.227.48.64' }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME || 'root' }}
      SSH_PASSWORD: ${{ vars.SSH_PASSWORD || '' }}
      SSH_PRIVATE_KEY: ${{ vars.SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY || '' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_REMOTE_DIR: ${{ vars.SSH_REMOTE_DIR || '/var/www/kribban.se' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up SSH known_hosts
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "ERROR: SSH_HOST is not set."
            exit 1
          fi
          if [ -z "$SSH_USERNAME" ]; then
            echo "ERROR: SSH_USERNAME is not set."
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY is not set. Add it as a GitHub Secret or Repository Variable."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to VPS (SSH/SCP)
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -P "$SSH_PORT" -r ./ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR"

      - name: Remove local excluded files
        run: |
          echo "Deployment completed."
