name: Deploy site and FastHTML app to STRATO

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://a.kribban.se
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_REMOTE_DIR: ${{ secrets.SSH_REMOTE_DIR || '/var/www/kribban.se' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa >/dev/null 2>&1 || { echo "ERROR: Decoded key is invalid. Check SSH_PRIVATE_KEY_B64."; exit 1; }
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Copy files to VPS (SSH/SCP)
        run: |
          echo "Connecting to $SSH_USERNAME@$SSH_HOST:$SSH_PORT"
          echo "Target directory: $SSH_REMOTE_DIR"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o PreferredAuthentications=publickey -P "$SSH_PORT" -r ./ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR"

      - name: Install and restart FastHTML app
        run: |
          ssh \
            -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no \
            -o PreferredAuthentications=publickey \
            -p "$SSH_PORT" \
            "$SSH_USERNAME@$SSH_HOST" \
            "REMOTE_DIR='$SSH_REMOTE_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$REMOTE_DIR"

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi

          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

          if [ ! -s .sesskey ]; then
            umask 027
            python3 -c 'import secrets; print(secrets.token_hex(32))' > .sesskey
          fi
          sudo chgrp www-data .sesskey
          chmod 640 .sesskey

          sudo install -m 0644 kribban-a.service /etc/systemd/system/kribban-a.service
          sudo install -m 0644 nginx-vhost.conf /etc/nginx/sites-available/kribban.se
          sudo ln -sfn /etc/nginx/sites-available/kribban.se /etc/nginx/sites-enabled/kribban.se

          sudo systemctl daemon-reload
          sudo nginx -t
          sudo systemctl enable kribban-a
          sudo systemctl restart kribban-a
          sudo systemctl is-active --quiet kribban-a
          sudo systemctl reload nginx
          REMOTE
