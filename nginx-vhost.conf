# Example nginx vhost configuration for kribban.se, a.kribban.se and b.kribban.se
# Replace the root paths below with the actual webroot path used by your STRATO hosting account.

server {
    listen 80;
    listen [::]:80;
    server_name kribban.se www.kribban.se;
    root /var/www/kribban.se;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name a.kribban.se;
    root /var/www/kribban.se/a;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name b.kribban.se;
    root /var/www/kribban.se/b;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
