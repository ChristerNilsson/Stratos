# Example nginx vhost configuration for kribban.se, a.kribban.se and b.kribban.se.
# Replace root and certificate paths below with the actual values used on your VPS.

# HTTP -> HTTPS redirects
server {
    listen 80;
    listen [::]:80;
    server_name kribban.se www.kribban.se a.kribban.se b.kribban.se;
    return 301 https://$host$request_uri;
}

# Main site: kribban.se
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kribban.se www.kribban.se;

    root /var/www/kribban.se;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kribban.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kribban.se/privkey.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Subdomain: a.kribban.se

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a.kribban.se;

    ssl_certificate /etc/letsencrypt/live/a.kribban.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kribban.se/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}


# Subdomain: b.kribban.se
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name b.kribban.se;

    root /var/www/kribban.se/b;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/kribban.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kribban.se/privkey.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}
